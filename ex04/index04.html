<!DOCTYPE html>
<html lang ="en">
	<head>
		<title> user registration form </title>
	</head>
	<body>
		<form>
			<label for = "name"> Full_Name </label>  <br>
			<input type = "text" id ="name" name = "name" required minlength ="3"> <br>

			<label for = "user-email" > Email </label> <br>
			<input type = "email" id ="user-email" name ="email" required > <br>

			<label for ="password"> Password </label> <br>
			<input type ="password" id ="password" name ="password" required minlength ="8" > <br>
			
			<br>

			<input type = "radio" id ="student" name ="role" value ="student" required >
			<label for ="student"> Student </label><br>
			<input type = "radio" id ="teacher" name ="role" value ="techer" required >
			<label for ="teacher"> Teacher </label><br>
			
			<br>

			<label for ="country"> Country </label><br>
			<select id ="country" name = "country" required >
				<option value = "" > Select country </option>
				<option value = "JO" selected > Jordan </option>
				<option value = "PL" > Palestine </option> 
  				<option value = "EG" > Egypt </option>

			</select><br>
			
			<hr>
	
			<label for ="bio"> BIO </label><br>
			<textarea id ="bio" name ="bio" required minlength ="10" ></textarea> <br>
			
			<hr>	

			<input type ="checkbox" id ="agree" name ="agree" required >	
			<label for ="agree"> Agree to the terms and conditions </label>
 
			<br>			

			<button type ="submit"> Submit </button><br>	

		</form>
	</body>
</html>
